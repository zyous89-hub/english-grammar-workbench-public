<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>채점 결과 확인</title>
<style>
:root{font:15px/1.55 "Malgun Gothic",sans-serif;color:#16344a;background:#f1f4f7}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button,select,input,textarea{border:1px solid #a7b6c1;border-radius:5px;padding:9px;background:#fff;color:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.65}button.primary{background:#147d83;border-color:#147d83;color:white;font-weight:bold}:focus-visible{outline:3px solid #d5851e;outline-offset:3px}header{padding:20px 28px;background:#fff;border-bottom:1px solid #bdcbd3;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:24px;margin:0}h2{font-size:19px;margin:0 0 16px}h3{font-size:16px;margin:22px 0 8px}p{margin:5px 0 12px}.quiet{color:#566e7e;font-size:13px}#notice{padding:8px 28px;margin:0;min-height:38px}#notice.error{color:#a44518;background:#fff0e7}.layout{display:grid;grid-template-columns:245px minmax(300px,1fr) 320px;gap:1px;background:#c8d4dc;min-height:calc(100vh - 133px)}nav,article,aside{background:#f1f4f7;padding:20px;min-width:0}nav{background:#e8eef2}nav label{display:block;margin-bottom:12px}nav select{width:100%;margin-top:5px}#questions{display:grid;gap:5px;max-height:calc(100vh - 260px);overflow:auto}#questions button{text-align:left;border-color:transparent;background:transparent}#questions button.selected{background:#fff;border-color:#147d83;border-left:4px solid #147d83}#questions span{display:block;font-size:12px;color:#566e7e}article{padding:24px;background:white}#evidence-select{width:100%;margin-bottom:12px}figure{margin:0;border:1px solid #d1dbe1;background:#f9fbfc;padding:12px;min-height:220px;text-align:center}figure img{max-width:100%;max-height:65vh;height:auto}figcaption{margin-top:10px;text-align:left;color:#566e7e;overflow-wrap:anywhere;font-size:13px}#image-error{color:#a44518}aside{background:#f8fafb}#automatic{padding-bottom:16px;border-bottom:1px solid #c8d4dc}dl{display:grid;grid-template-columns:76px 1fr;gap:8px;margin:0}dt{color:#566e7e}dd{margin:0;overflow-wrap:anywhere}#reasons{padding-left:20px;font-size:14px;overflow-wrap:anywhere}#difference{border-left:4px solid #b96625;padding:10px;background:#fff0e7;color:#7e3817;margin:14px 0}#editor label{display:block;margin:12px 0}#editor input:not([type=checkbox]),#editor select,#editor textarea{width:100%;margin-top:5px}#editor textarea{min-height:70px}#effective{font-size:18px;font-weight:bold;color:#147d83;margin-bottom:10px}#rules{overflow-wrap:anywhere}.hidden,[hidden]{display:none!important}.empty{padding:40px;color:#566e7e}@media(max-width:1050px){.layout{grid-template-columns:200px 1fr}aside{grid-column:2}nav{grid-row:1/3}}@media(max-width:620px){header{padding:16px;align-items:start;flex-direction:column;gap:10px}.layout{display:block}nav,article,aside{padding:16px}#questions{max-height:160px}#notice{padding:8px 16px}figure img{max-height:none}}
</style></head><body>
<header><div><h1 id="title">채점 결과 확인</h1><p class="quiet">파일 계약 검증용 화면 · 자동 판정과 교사 확인을 따로 보존합니다.</p></div><button id="reload">결과 다시 불러오기</button></header>
<p id="notice" role="status" aria-live="polite">결과 파일을 읽고 있습니다.</p>
<main class="layout">
<nav aria-label="문항 목록"><label>문항 보기<select id="filter"><option value="held">확인 필요</option><option value="all">전체 문항</option><option value="different">교사 값과 자동 결과가 다름</option></select></label><p id="total" class="quiet"></p><div id="questions"></div></nav>
<article><h2 id="question-title">문항을 선택하세요</h2><div id="evidence-panel" hidden><label for="evidence-select">근거 이미지</label><select id="evidence-select"></select><figure><img id="evidence" alt=""><p id="image-error" hidden>이 근거 이미지를 읽을 수 없습니다. 결과 파일의 이름표와 경로를 확인하세요.</p><figcaption id="caption"></figcaption></figure></div><p id="no-evidence" class="empty" hidden>결과 파일에 근거 이미지가 없습니다.</p></article>
<aside id="detail" hidden><section id="automatic"><h2>엔진이 기록한 결과</h2><dl><dt>판정</dt><dd id="auto-judgement"></dd><dt>읽은 답</dt><dd id="auto-answer"></dd><dt>답지 정답</dt><dd id="key-answer"></dd><dt>보류 단계</dt><dd id="stage"></dd></dl><ul id="reasons"></ul><p class="quiet">채점 규칙 버전</p><p class="quiet" id="rules"></p></section>
<section><h3>최종 표시</h3><p id="effective"></p><p id="difference" hidden>교사 값이 우선입니다. 자동 결과와 다르지만 교사 수정은 유지했습니다.</p><p id="teacher-meta" class="quiet"></p></section>
<form id="editor"><h3>교사 확인</h3><label>학생이 쓴 답<input id="teacher-answer" autocomplete="off"></label><label><input id="answer-unset" type="checkbox"> 답 미확정</label><label>교사 판정<select id="teacher-judgement"><option>정답</option><option>오답</option><option>보류</option></select></label><label>메모<textarea id="teacher-note"></textarea></label><button id="save" class="primary" type="submit">교사 수정 저장</button><p class="quiet">자동 결과 파일은 바꾸지 않습니다.</p></form></aside>
</main>
<script nonce="__TOKEN__">
const token='__TOKEN__';let state=null,selected=null,dirty=false,busy=false;
const el=id=>document.getElementById(id), text=(id,value)=>{el(id).textContent=value}, answer=v=>v===null?'미확정':v===''?'빈 답':v;
function notice(message,error=false){text('notice',message);el('notice').classList.toggle('error',error)}
function current(){return state.rows.find(r=>r.automatic.id===selected)}
function mayLeave(){return !dirty||confirm('저장하지 않은 수정이 있습니다. 이 수정을 버리고 이동할까요?')}
function list(){let rows=state.rows;const mode=el('filter').value;if(mode==='held')rows=rows.filter(r=>r.effective.judgement==='보류');if(mode==='different')rows=rows.filter(r=>r.differs);el('questions').replaceChildren();text('total',`${rows.length} / ${state.rows.length}문항`);for(const r of rows){let b=document.createElement('button');b.type='button';b.textContent=r.automatic.label;b.classList.toggle('selected',r.automatic.id===selected);let small=document.createElement('span');small.textContent=`${r.effective.judgement}${r.teacher?' · 교사 확인':''}${r.differs?' · 자동 결과와 다름':''}`;b.append(small);b.onclick=()=>{if(busy||!mayLeave())return;selected=r.automatic.id;dirty=false;list();detail()};el('questions').append(b)}}
function image(){const q=current().automatic,e=q.evidence_images[el('evidence-select').value];if(!e)return;el('image-error').hidden=true;el('evidence').hidden=false;el('evidence').alt=e.label;text('caption',e.label);el('evidence').src='/image?'+new URLSearchParams({question:q.id,evidence:e.id,run:state.result.result_id})}
function detail(){const row=current();el('detail').hidden=!row;if(!row){text('question-title','문항을 선택하세요');el('evidence-panel').hidden=true;return}const q=row.automatic;document.title=state.result.title+' · 결과 확인';text('question-title',q.label);text('auto-judgement',q.judgement);text('auto-answer',answer(q.read_answer));text('key-answer',answer(q.answer_key));text('stage',q.review_stage===null?'—':`${q.review_stage}단계`);text('rules',q.rules_version);el('reasons').replaceChildren();for(const reason of q.reasons){let item=document.createElement('li');item.textContent=`${reason.code} · ${reason.message}${reason.stage===null?'':` (${reason.stage}단계)`}`;el('reasons').append(item)}text('effective',`${row.effective.judgement} · ${answer(row.effective.read_answer)}`);el('difference').hidden=!row.differs;text('teacher-meta',row.teacher?`교사 수정 저장: ${row.teacher.updated_at}`:'아직 교사 수정이 없습니다.');el('teacher-answer').value=row.effective.read_answer??'';el('answer-unset').checked=row.effective.read_answer===null;el('teacher-answer').disabled=el('answer-unset').checked;el('teacher-judgement').value=row.effective.judgement;el('teacher-note').value=row.teacher?.note??'';el('evidence-panel').hidden=!q.evidence_images.length;el('no-evidence').hidden=!!q.evidence_images.length;el('evidence-select').replaceChildren();q.evidence_images.forEach((e,i)=>{let option=document.createElement('option');option.value=i;option.textContent=e.label;el('evidence-select').append(option)});image()}
function display(){text('title',state.result.title);if(!state.rows.some(r=>r.automatic.id===selected))selected=state.rows.find(r=>r.effective.judgement==='보류')?.automatic.id??state.rows[0]?.automatic.id??null;list();detail()}
async function reload(){if(busy||!mayLeave())return;try{const response=await fetch('/api/state',{cache:'no-store'}),data=await response.json();if(!response.ok)throw Error(data.error);state=data;dirty=false;display();notice(`결과를 불러왔습니다.${state.orphaned.length?` 현재 문항에 연결되지 않은 교사 수정 ${state.orphaned.length}건도 파일에 보존했습니다.`:''}`)}catch(error){notice(error.message,true)}}
el('reload').onclick=reload;el('filter').onchange=list;el('evidence-select').onchange=image;el('evidence').onerror=()=>{el('evidence').hidden=true;el('image-error').hidden=false};el('editor').oninput=()=>{dirty=true;el('teacher-answer').disabled=el('answer-unset').checked};el('editor').onsubmit=async event=>{event.preventDefault();if(!state||busy)return;busy=true;el('save').disabled=true;el('reload').disabled=true;try{const response=await fetch('/api/correction',{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify({question_id:selected,read_answer:el('answer-unset').checked?null:el('teacher-answer').value,judgement:el('teacher-judgement').value,note:el('teacher-note').value,revision:state.revision,result_id:state.result.result_id})}),data=await response.json();if(!response.ok)throw Error(data.error);state=data;dirty=false;display();notice('교사 수정 파일에 저장했습니다.')}catch(error){notice(error.message,true)}finally{busy=false;el('save').disabled=false;el('reload').disabled=false}};window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});reload();
</script></body></html>
